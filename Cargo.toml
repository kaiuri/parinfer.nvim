[package]
name = "parinfer_nvim"
version = "0.1.0"
authors = ["Uriel Caiado <uriel.aciole@gmail.com>"]
repository = "https://github.com/kaiuri/parinfer.nvim"
description = ""
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
mlua = { version = "0.11.3", features = ["luajit", "module"] }
unicode-segmentation = "1.1.0"
unicode-width = "0.2.1"
[dev-dependencies]
quickcheck = "1.0.3"
quickcheck_macros = "1.1.0"

[lib]
crate-type = ["cdylib"]
